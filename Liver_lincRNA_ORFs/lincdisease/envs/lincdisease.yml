name: lincdisease
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - numpy
  - pandas>=2.0
  - scipy
  - statsmodels
  - scikit-learn
  - lifelines
  - matplotlib
  - pybigwig
  - pysam
  - requests
  - openpyxl
  - pytest
  - ipykernel        # notebook execution (nbclient) and HTML export (nbconvert)
  - nbclient
  - nbformat
  - nbconvert
  - pyyaml           # notebook reads config/config.yaml
  - bedtools
  - diamond
