# Environment of the lincdisease package, its tests and the notebook. Versions of the v2 results; the exact build
# is in lincdisease.lock.txt (mamba create -p <prefix> --file lincdisease.lock.txt).
name: lincdisease
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - numpy=2.4
  - pandas=3.1
  - scipy=1.17
  - statsmodels=0.15
  - scikit-learn=1.9
  - lifelines=0.30
  - matplotlib=3.11
  - pybigwig=0.3.26
  - pysam=0.24
  - requests
  - openpyxl
  - pytest
  - ipykernel        # notebook execution (nbclient) and HTML export (nbconvert)
  - nbclient
  - nbformat
  - nbconvert
  - pyyaml           # notebook reads config/config.yaml
  - bedtools=2.31
  - diamond=2.2.8
